name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the website
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Require the account's root Pages repository
        shell: bash
        run: |
          if [[ "${GITHUB_REPOSITORY,,}" != "${GITHUB_REPOSITORY_OWNER,,}/${GITHUB_REPOSITORY_OWNER,,}.github.io" ]]; then
            echo "::error::Use the username.github.io repository. Project-path hosting also requires updating this site's root-relative links."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          cache: true

      - name: Read the Pages configuration
        id: pages
        uses: actions/configure-pages@v5

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the static portfolio
        run: pnpm build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: Upload the built website
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
